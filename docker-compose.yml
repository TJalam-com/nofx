services:
  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow 30 seconds for graceful shutdown
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      # Data directory for database and logs
      # Log files are saved to data/nofx_YYYY-MM-DD.log
      - ./data:/app/data
      # Decision logs directory for AI decision records
      # Decision logs are saved to data/decision_logs/{trader_id}/decision_*.json
      - ./data/decision_logs:/app/data/decision_logs
      - ./beta_codes.txt:/app/beta_codes.txt:ro
      - ./prompts:/app/prompts
      # Secrets directory (RSA keys and data encryption key) on persistent disk
      - ./data/secrets:/app/data/secrets:ro
      - /etc/localtime:/etc/localtime:ro  # Sync host time
    environment:
      - TZ=${NOFX_TIMEZONE:-Asia/Shanghai}  # Set timezone
      - AI_MAX_TOKENS=4000  # Maximum tokens for AI response (default 2000, recommended 4000-8000)
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}  # Database encryption key
      - JWT_SECRET=${JWT_SECRET}  # JWT authentication secret
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge